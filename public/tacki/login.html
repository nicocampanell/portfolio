</section><script>function fit(){var area=document.getElementById('login');area.style.transform='translate(-50%,-50%) scaleX('+(innerWidth/1280)+') scaleY('+(innerHeight/832)+')'}addEventListener('resize',fit);fit();
(function(){
  var area=document.getElementById('login'),root=area&&area.querySelector('.screen > div'),btn=root&&root.querySelector('[data-create]'),box=root&&root.querySelector('[data-email]'),msg=root&&root.querySelector('[data-emsg]');
  if(!btn||!box||!msg||(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches))return;
  var NS='http://www.w3.org/2000/svg';
  var cur=document.createElementNS(NS,'svg');cur.setAttribute('class','login-cursor');cur.setAttribute('viewBox','0 0 24 30');
  cur.innerHTML='<path d="M3 2v22l6-5.5 4 9 4-1.8-4-8.8h8z" fill="#212121" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>';
  var ring=document.createElement('div');ring.className='login-ring';
  root.appendChild(ring);root.appendChild(cur);
  var timers=[],tok=0;
  var r0=root.getBoundingClientRect(),b=btn.getBoundingClientRect();
  var tx=(b.left-r0.left+b.width*.62)/(innerWidth/1280),ty=(b.top-r0.top+b.height*.5)/(innerHeight/832);
  var sx=tx+210,sy=ty+190,mx=tx+70,my=ty+110;
  var RED='#C4372C',INK='#2E38338C';
  function at(ms,f){timers.push(setTimeout(f,ms))}
  function pos(x,y,s){return 'translate('+x+'px,'+y+'px) scale('+(s||1)+')'}
  function reset(){[cur,ring,btn,box,msg].forEach(function(e){e.getAnimations().forEach(function(a){a.cancel()})});cur.style.opacity=0;cur.style.transform=pos(sx,sy);ring.style.opacity=0}
  function run(){
    var my_=++tok;timers.forEach(clearTimeout);timers=[];reset();
    at(500,function(){
      cur.animate([{opacity:0,transform:pos(sx,sy)},{opacity:1,offset:.15,transform:pos(sx-30,sy-25)},{transform:pos(mx,my),offset:.6},{opacity:1,transform:pos(tx,ty)}],{duration:1300,easing:'cubic-bezier(.45,0,.25,1)',fill:'forwards'});
    });
    at(1950,function(){
      cur.animate([{transform:pos(tx,ty,1)},{transform:pos(tx,ty,.82)},{transform:pos(tx,ty,1)}],{duration:240,easing:'ease-out',fill:'forwards'});
      btn.animate([{transform:'scale(1)',filter:'brightness(1)'},{transform:'scale(.97)',filter:'brightness(.9)'},{transform:'scale(1)',filter:'brightness(1)'}],{duration:260,easing:'ease-out'});
      ring.style.left=tx+'px';ring.style.top=ty+'px';
      ring.animate([{opacity:.5,transform:'scale(.3)'},{opacity:0,transform:'scale(1.5)'}],{duration:500,easing:'cubic-bezier(.2,.8,.2,1)'});
    });
    at(2150,function(){
      box.animate([{outlineColor:INK,backgroundColor:'rgba(251,234,232,0)'},{outlineColor:RED,backgroundColor:'#FBEAE8'}],{duration:180,easing:'ease-out',fill:'forwards'});
      box.animate([{transform:'translateX(0)'},{transform:'translateX(-9px)'},{transform:'translateX(8px)'},{transform:'translateX(-6px)'},{transform:'translateX(5px)'},{transform:'translateX(-3px)'},{transform:'translateX(0)'}],{duration:520,easing:'ease-in-out'});
      msg.animate([{height:'0px',marginTop:'-8px',opacity:0},{height:'20px',marginTop:'0px',opacity:1}],{duration:260,delay:60,easing:'cubic-bezier(.2,.8,.2,1)',fill:'forwards'});
      cur.animate([{transform:pos(tx,ty)},{transform:pos(tx,ty+28)}],{duration:260,delay:60,easing:'cubic-bezier(.2,.8,.2,1)',fill:'forwards'});
    });
    at(5600,function(){
      cur.animate([{opacity:1},{opacity:0}],{duration:280,easing:'ease-in',fill:'forwards'});
      cur.animate([{transform:pos(tx,ty+28)},{transform:pos(tx,ty)}],{duration:280,easing:'ease-in',fill:'forwards'});
      box.animate([{outlineColor:RED,backgroundColor:'#FBEAE8'},{outlineColor:INK,backgroundColor:'rgba(251,234,232,0)'}],{duration:280,easing:'ease-in',fill:'forwards'});
      msg.animate([{height:'20px',marginTop:'0px',opacity:1},{height:'0px',marginTop:'-8px',opacity:0}],{duration:280,easing:'ease-in',fill:'forwards'});
    });
    at(6600,function(){if(my_===tok)run()});
  }
  reset();
  if('IntersectionObserver' in window)new IntersectionObserver(function(en){if(en[0].isIntersecting)run();else{tok++;timers.forEach(clearTimeout);timers=[];reset()}},{threshold:.2}).observe(area);else run();
})();</script></body></html>
