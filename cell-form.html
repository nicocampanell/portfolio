<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cell form</title>
  <style>
    html, body { margin: 0; height: 100%; background: #f2f2ec; -webkit-font-smoothing: antialiased; }
    #stage { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <!--
    Copy this file into your site (e.g. public/cell-form.html) plus your portrait PNG.
    In the portfolio:

    <iframe
      src="/cell-form.html?src=/me.png"
      title="Interactive cell portrait"
      style="width:100%;height:560px;border:0"
    ></iframe>

    Query: src, cols, contrast, mouse-str, auto-rotate=1
  -->
  <div id="stage" data-cell-form mouse-follow="true"></div>
  <script>
(function () {
  const GLYPHS = ["0", "1", "X", "E", "V", "T", "L", "F", "A", "N", "Y", "#", "XT", "LX", "0X", "1E", "EL"];
  const hash = (i) => Math.abs(Math.sin(i * 12.9898) * 43758.5453) % 1;
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp01 = (v) => Math.min(1, Math.max(0, v));
  const hexRgb = (h) => {
    const n = parseInt(h.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  };
  const stretch = (L, c) => clamp01((L - 0.5) * c + 0.5);

  function defaultImage() {
    const off = document.createElement("canvas");
    off.width = 640;
    off.height = 900;
    const g = off.getContext("2d");
    g.fillStyle = "#f2f2ec";
    g.fillRect(0, 0, 640, 900);
    g.fillStyle = "#3b5bff";
    g.beginPath();
    g.ellipse(320, 210, 70, 82, 0, 0, Math.PI * 2);
    g.fill();
    g.beginPath();
    g.moveTo(250, 300);
    g.quadraticCurveTo(320, 280, 390, 300);
    g.lineTo(420, 620);
    g.quadraticCurveTo(320, 680, 220, 620);
    g.closePath();
    g.fill();
    g.fillRect(230, 610, 55, 210);
    g.fillRect(355, 610, 55, 210);
    return off;
  }

  function sample(img, S) {
    const cols = S.cols | 0;
    const iw = img.naturalWidth || img.width || 1;
    const ih = img.naturalHeight || img.height || 1;
    const rows = Math.max(8, Math.min(96, Math.round((cols * ih) / iw)));
    const off = document.createElement("canvas");
    off.width = cols;
    off.height = rows;
    const g = off.getContext("2d", { willReadFrequently: true });
    g.fillStyle = S.bg;
    g.fillRect(0, 0, cols, rows);
    const ir = iw / ih, vr = cols / rows;
    let dw = cols, dh = rows, dx = 0, dy = 0;
    if (ir > vr) { dh = cols / ir; dy = (rows - dh) / 2; }
    else { dw = rows * ir; dx = (cols - dw) / 2; }
    g.drawImage(img, dx, dy, dw, dh);
    const data = g.getImageData(0, 0, cols, rows).data;
    const [br, bgc, bb] = hexRgb(S.bg);
    const occ = Array.from({ length: rows }, () => Array(cols).fill(false));
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const i = (y * cols + x) * 4;
        const L = (data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114) / 255;
        const pad = (data[i] - br) ** 2 + (data[i + 1] - bgc) ** 2 + (data[i + 2] - bb) ** 2 < 400;
        if (data[i + 3] < 40 || pad || L > 0.95) continue;
        occ[y][x] = true;
      }
    }
    const span = Math.max(cols, rows);
    const out = [];
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        if (!occ[y][x]) continue;
        const gx = (occ[y][x + 1] ? 1 : 0) - (occ[y][x - 1] ? 1 : 0);
        const gy = ((occ[y + 1] && occ[y + 1][x]) ? 1 : 0) - ((occ[y - 1] && occ[y - 1][x]) ? 1 : 0);
        const n = out.length;
        const i = (y * cols + x) * 4;
        const pL = (data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114) / 255;
        const ilum = stretch(pL, S.contrast);
        const k = hash(n + 1);
        const ang = hash(n + 9) * Math.PI * 2;
        const r0 = 40 + hash(n + 3) * 140;
        out.push({
          wx: (x + 0.5 - cols / 2) * (360 / span),
          wy: (y + 0.5 - rows / 2) * (360 / span),
          wz: (0.5 - ilum) * 18,
          sx: Math.cos(ang) * r0,
          sy: Math.sin(ang) * r0 * 0.4,
          sz: (hash(n + 5) - 0.5) * 80,
          seed: n + 1,
          kind: k < 0.48 ? "text" : k < 0.68 ? "solid" : k < 0.84 ? "hatch" : "dots",
          glyph: GLYPHS[Math.min(GLYPHS.length - 1, (ilum * 12) | 0)],
          nx: gx, ny: -gy, nz: 1.2,
          rgb: [data[i], data[i + 1], data[i + 2]],
          ilum,
          delay: Math.hypot(x - cols / 2, y - rows / 2) / 180,
        });
      }
    }
    return out;
  }

  function start(canvas, img, opts) {
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const S = {
      autoRotate: !!opts.autoRotate && !reduce,
      mouseFollow: opts.mouseFollow !== false,
      speed: opts.speed ?? 1,
      orbitH: opts.orbitH ?? 28, orbitV: opts.orbitV ?? 8, zoom: opts.zoom ?? 1.35,
      mouseStr: opts.mouseStr ?? 14,
      noise: opts.noise ?? 1.6,
      keyX: opts.keyX ?? 5.9, keyY: opts.keyY ?? 5, keyZ: opts.keyZ ?? 4, keyI: opts.keyI ?? 1.3,
      fillX: opts.fillX ?? -3, fillY: opts.fillY ?? -2, fillZ: opts.fillZ ?? 1.9, fillI: opts.fillI ?? 0.5,
      ambient: opts.ambient ?? 0.55, mix: opts.mix ?? 42,
      main: opts.main || "#7c5cff",
      secondary: opts.secondary || "#ddd6fe",
      bg: opts.bg || "#f2f2ec",
      trail: opts.trail !== false, decay: opts.decay ?? 0.28,
      cols: opts.cols ?? 36,
      contrast: opts.contrast ?? 1.9,
    };
    const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });
    const cells = sample(img, S);
    let raf = 0, last = 0, time = 0, t0 = performance.now();
    let mx = 0.5, my = 0.5, followH = 0, followV = 0, visible = true;

    const lighting = (c) => {
      const oh = ((S.orbitH + followH) * Math.PI) / 180;
      const ov = ((S.orbitV + followV) * Math.PI) / 180;
      const n0 = Math.hypot(c.nx, c.ny, c.nz) || 1;
      let nx = c.nx / n0, ny = c.ny / n0, nz = c.nz / n0;
      const cy = Math.cos(oh), sy = Math.sin(oh);
      const x1 = nx * cy + nz * sy;
      const z1 = -nx * sy + nz * cy;
      const cx = Math.cos(ov), sx = Math.sin(ov);
      const ny2 = ny * cx - z1 * sx;
      const nz2 = ny * sx + z1 * cx;
      nx = x1;
      ny = ny2;
      nz = nz2;
      const lit = (lx, ly, lz, i) => {
        const l = Math.hypot(lx, ly, lz) || 1;
        return Math.max(0, nx * (lx / l) + ny * (ly / l) + nz * (lz / l)) * i;
      };
      return S.ambient + lit(S.keyX, S.keyY, S.keyZ, S.keyI) + lit(S.fillX, S.fillY, S.fillZ, S.fillI);
    };

    const shade = (c) => {
      const [mr, mg, mb] = hexRgb(S.main);
      const [sr, sg, sb] = hexRgb(S.secondary);
      const L = lighting(c);
      const d = c.ilum;
      const t = S.mix / 100;
      const lift = 0.75 + 0.45 * Math.min(1.2, L);
      let r = c.rgb[0] * (0.55 + 0.7 * d) * lift;
      let g = c.rgb[1] * (0.55 + 0.7 * d) * lift;
      let b = c.rgb[2] * (0.55 + 0.7 * d) * lift;
      r = lerp(r, lerp(sr, mr, d), t * 0.4);
      g = lerp(g, lerp(sg, mg, d), t * 0.4);
      b = lerp(b, lerp(sb, mb, d), t * 0.4);
      return { css: `rgb(${r | 0},${g | 0},${b | 0})`, d };
    };

    function resize() {
      const dpr = Math.min(devicePixelRatio || 1, S.cols > 48 ? 1 : 1.5);
      canvas.width = Math.floor(canvas.clientWidth * dpr);
      canvas.height = Math.floor(canvas.clientHeight * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = S.bg;
      ctx.fillRect(0, 0, canvas.clientWidth, canvas.clientHeight);
    }
    resize();

    const project = (x, y, z, w, h) => {
      const oh = ((S.orbitH + followH) * Math.PI) / 180;
      const ov = ((S.orbitV + followV) * Math.PI) / 180;
      const cy = Math.cos(oh), sy = Math.sin(oh);
      const x1 = x * cy + z * sy;
      const z1 = -x * sy + z * cy;
      const cx = Math.cos(ov), sx = Math.sin(ov);
      const y1 = y * cx - z1 * sx;
      const z2 = y * sx + z1 * cx;
      const f = (420 * S.zoom) / (420 + z2);
      return { x: w / 2 + x1 * f, y: h / 2 + y1 * f, z: z2, s: Math.max(0.35, Math.min(1.6, f)) };
    };

    function frame(now) {
      if (!visible) { raf = 0; return; }
      const w = canvas.clientWidth, h = canvas.clientHeight;
      const dt = last ? Math.min(0.05, (now - last) / 1000) : 0;
      last = now;
      time += dt * 1000 * (S.speed || 1);
      if (S.autoRotate) S.orbitH = ((S.orbitH + dt * (S.speed || 1) * 12) + 180) % 360 - 180;
      if (S.mouseFollow) {
        followH += ((mx - 0.5) * S.mouseStr * 2 - followH) * 0.1;
        followV += ((my - 0.5) * S.mouseStr - followV) * 0.1;
      }
      const [br, bg, bb] = hexRgb(S.bg);
      ctx.fillStyle = `rgba(${br},${bg},${bb},${S.trail ? S.decay : 1})`;
      ctx.fillRect(0, 0, w, h);
      const drawn = [];
      for (const c of cells) {
        const p = reduce ? 1 : Math.min(1, Math.max(0, (now - t0 - c.delay * 420) / 900));
        const e = 1 - (1 - p) ** 3;
        let x = lerp(c.sx, c.wx, e);
        let y = lerp(c.sy, c.wy, e);
        let z = lerp(c.sz, c.wz, e);
        const t = time * 0.001;
        x += Math.sin(t * 2.2 + c.seed) * S.noise * 0.35;
        y += Math.cos(t * 1.7 + c.seed * 1.3) * S.noise * 0.28;
        drawn.push({ c, p: project(x, y, z, w, h) });
      }
      drawn.sort((a, b) => a.p.z - b.p.z);
      for (const { c, p: pr } of drawn) {
        const size = Math.min(18, 7.2 * pr.s * (40 / S.cols));
        if (size < 1.2) continue;
        const sh = shade(c);
        const kind = c.kind;
        const x = pr.x | 0, y = pr.y | 0, s = size / 2;
        ctx.globalAlpha = 0.88 + 0.12 * Math.min(1, pr.s);
        ctx.fillStyle = sh.css;
        ctx.fillRect(x - s, y - s, size, size);
        ctx.strokeStyle = "rgba(0,0,0,0.28)";
        ctx.lineWidth = 0.5;
        ctx.strokeRect(x - s, y - s, size, size);
        if (kind === "hatch") {
          ctx.strokeStyle = "rgba(0,0,0,0.35)";
          ctx.lineWidth = 0.7;
          ctx.beginPath();
          for (let i = -size; i < size; i += 2.4) {
            ctx.moveTo(x + i, y - s);
            ctx.lineTo(x + i + size, y + s);
          }
          ctx.stroke();
        } else if (kind === "dots" && size > 4) {
          ctx.fillStyle = "rgba(0,0,0,0.2)";
          const gsz = Math.max(2.6, size / 3);
          for (let dy = -s + 1.2; dy < s; dy += gsz) {
            for (let dx = -s + 1.2; dx < s; dx += gsz) {
              ctx.fillRect(x + dx, y + dy, 1.4, 1.4);
            }
          }
        } else if (kind === "text" && size > 4) {
          ctx.fillStyle = sh.d < 0.42 ? "#f4f4f4" : "#111";
          ctx.font = `600 ${Math.max(6, size * 0.52) | 0}px ui-monospace, monospace`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(c.glyph, x, y + 0.5);
        }
        ctx.globalAlpha = 1;
      }
      raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);

    const onMove = (e) => {
      const r = canvas.getBoundingClientRect();
      mx = (e.clientX - r.left) / r.width;
      my = (e.clientY - r.top) / r.height;
    };
    const onLeave = () => { mx = 0.5; my = 0.5; };
    canvas.addEventListener("pointermove", onMove);
    canvas.addEventListener("pointerleave", onLeave);
    addEventListener("resize", resize);

    const io = new IntersectionObserver((entries) => {
      visible = entries[0].isIntersecting;
      if (visible && !raf) { last = 0; raf = requestAnimationFrame(frame); }
    });
    io.observe(canvas);

    return () => {
      visible = false;
      cancelAnimationFrame(raf);
      io.disconnect();
      canvas.removeEventListener("pointermove", onMove);
      canvas.removeEventListener("pointerleave", onLeave);
      removeEventListener("resize", resize);
    };
  }

  function fromQuery() {
    const baked = /*PRESET*/null/*END*/ || {};
    const q = new URLSearchParams(location.search);
    const out = Object.assign({}, baked);
    if (q.get("src")) out.src = q.get("src");
    if (q.has("cols")) out.cols = Number(q.get("cols"));
    if (q.has("contrast")) out.contrast = Number(q.get("contrast"));
    if (q.has("mouse-str")) out.mouseStr = Number(q.get("mouse-str"));
    if (q.get("mouse-follow") === "false") out.mouseFollow = false;
    if (q.get("auto-rotate") === "1" || q.get("auto-rotate") === "true") out.autoRotate = true;
    return out;
  }

  function mount(host, opts) {
    const canvas = document.createElement("canvas");
    canvas.setAttribute("aria-label", "Interactive cell portrait");
    canvas.style.cssText = "width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;user-select:none;-webkit-tap-highlight-color:transparent";
    host.innerHTML = "";
    host.appendChild(canvas);
    let stop = () => {};
    const run = (img) => { stop(); stop = start(canvas, img, opts); };
    if (!opts.src) {
      run(defaultImage());
      return () => stop();
    }
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => run(img);
    img.onerror = () => run(defaultImage());
    img.src = opts.src;
    return () => { img.onload = null; stop(); };
  }

  mount(document.getElementById("stage"), fromQuery());

  {
    const cells = sample(defaultImage(), { cols: 24, contrast: 1.9, bg: "#f2f2ec" });
    console.assert(cells.length > 20, "default figure should occupy cells");
  }
})();
  </script>
</body>
</html>
